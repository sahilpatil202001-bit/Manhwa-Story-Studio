[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa-story-studio"
version = "0.1.0"
description = "Automated manhwa story explainer video production pipeline"
readme = "Readme.md"
requires-python = ">=3.11"
authors = [{ name = "Manhwa Story Studio Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pillow>=10.2.0",
    "edge-tts>=7.0.0",
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
manhwa-studio = "manhwa_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
